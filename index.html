.modal-back{position:fixed;inset:0;background:rgba(6,9,26,.78);display:grid;place-items:center;padding:18px;z-index:100}.modal{width:min(700px,100%);padding:25px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,130px);opacity:0;background:#fff2c4;color:#332430;border:4px solid var(--gold2);padding:14px 22px;border-radius:17px;font-weight:1000;z-index:110;transition:.3s}.toast.show{transform:translate(-50%,0);opacity:1}.flash{position:fixed;inset:0;pointer-events:none;background:rgba(255,225,126,.3);opacity:0;z-index:90}.flash.go{animation:flash .35s}@keyframes flash{50%{opacity:1}}
@media(max-width:900px){.welcome-grid,.report-grid{grid-template-columns:1fr}.name-box{grid-column:auto}.prologue{grid-template-columns:280px 1fr}.problem-grid{grid-template-columns:1fr}.problem{min-height:280px}.problem-intro{grid-template-columns:170px 1fr}.shelves{grid-template-columns:1fr}.baskets{grid-template-columns:1fr}.basket{min-height:105px}.map-canvas{min-height:650px}.map-branch{width:44%}.mb0,.mb1{top:18px}.mb2,.mb3{bottom:18px}.map-center{top:245px}.map-line{display:none}}
@media(max-width:620px){main{padding:12px}.topbar{align-items:flex-start}.status .pill:first-child{display:none}.hero{padding:25px 13px}.welcome-grid{grid-template-columns:1fr}.prologue,.problem-intro{grid-template-columns:1fr;text-align:center}.prologue .cangjie{transform:scale(.75);margin-top:-35px;margin-bottom:-35px}.choice-grid{grid-template-columns:1fr}.quest-node small{display:none}.quest-node span{width:34px;height:34px}.quest-node:not(:last-child):after{top:16px}.task-top{grid-template-columns:1fr}.map-branch{width:48%;font-size:15px}.mb0,.mb2{left:0}.mb1,.mb3{right:0}.map-center{width:205px}.guide-layer{grid-template-columns:80px 1fr}.guide-layer .bubble{font-size:15px}.actions,.ask{flex-direction:column}.btn{width:100%}.name-input{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="world"></div>
<div id="guide" class="guide-layer" aria-live="polite"><div id="guideCj"></div><div id="guideText" class="bubble"></div></div>
<div id="toast" class="toast" role="status"></div><div id="flash" class="flash"></div>
<script>
(()=>{'use strict';
const KEY='cangjieWarehouse:v2';
const blankTask=()=>({type:'',stage:0,selected:'',answers:{},logs:[],knotIndex:0,revealed:[],placements:{},marked:[],counts:{},diffs:{},directions:{},reason:''});
const blank=()=>({name:'',signature:'',route:'',screen:'welcome',prologue:0,score:0,completed:[],results:{},lastMap:'',sound:true,started:false,task:blankTask()});
let state=load(),lastScreen='';let audioCtx=null,guideTimer=null,canvasDrawing=false;
const P={record:{icon:'📦',short:'记不住',title:'记录',desc:'货物不断送来，数量、种类和时间全乱了。建立一套能复查的收货记录。',accent:'#e7a14c'},classify:{icon:'🧺',short:'找不到',title:'分类',desc:'仓库像迷宫一样，急用的东西怎么找也找不到。设计分类法并通过找物考验。',accent:'#6cc6a9'},audit:{icon:'🔍',short:'对不上',title:'盘点',desc:'记录册和货架数量不同。数清、找错、算差、追原因，再修正记录。',accent:'#6ebce6'}};
const goods=[{id:'pot',name:'陶罐',e:'🏺',fragile:1,use:'生活用品',material:'石土',size:'大件'},{id:'axe',name:'石斧',e:'🪓',fragile:0,use:'生产工具',material:'石土',size:'中件'},{id:'egg',name:'鸟蛋',e:'🥚',fragile:1,use:'食物',material:'动物',size:'小件'},{id:'basket',name:'草篮',e:'🧺',fragile:0,use:'生活用品',material:'植物',size:'大件'},{id:'apple',name:'果子',e:'🍎',fragile:0,use:'食物',material:'植物',size:'小件'},{id:'bowl',name:'石碗',e:'🥣',fragile:1,use:'生活用品',material:'石土',size:'小件'},{id:'wood',name:'木棒',e:'🪵',fragile:0,use:'生产工具',material:'植物',size:'大件'},{id:'hide',name:'兽皮衣',e:'🥋',fragile:0,use:'生活用品',material:'动物',size:'大件'},{id:'grain',name:'谷穗',e:'🌾',fragile:0,use:'食物',material:'植物',size:'小件'},{id:'hammer',name:'石锤',e:'🔨',fragile:0,use:'生产工具',material:'石土',size:'中件'},{id:'shoe',name:'皮靴',e:'🥾',fragile:0,use:'生活用品',material:'动物',size:'中件'},{id:'meat',name:'肉干',e:'🍖',fragile:0,use:'食物',material:'动物',size:'小件'}];
const methods={use:{label:'按用途',icon:'🎯',groups:['食物','生产工具','生活用品'],field:'use'},material:{label:'按材质',icon:'🪨',groups:['植物','动物','石土'],field:'material'},size:{label:'按大小',icon:'📏',groups:['小件','中件','大件'],field:'size'}};
const auditRows=[{name:'果子',e:'🍎',actual:6,book:8},{name:'石斧',e:'🪓',actual:4,book:4},{name:'兽皮',e:'🟫',actual:5,book:3},{name:'陶罐',e:'🏺',actual:2,book:2}];
const praises=['你先观察再行动，像真正的仓库智者！','你没有乱猜，每一步都有证据！','这一步做得又稳又准，神鸟都看见啦！','你把大难题拆成小步骤，太聪明了！','仓颉要把你的办法刻在金色木简上！','你刚才的判断很有条理，继续保持！','四只眼睛都没你看得仔细！','你不只会做，还能说清为什么！'];
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function cj(){return `<div class="cangjie" role="img" aria-label="四眼仓颉"><div class="cj-aura"></div><div class="cj-arm left"></div><div class="cj-arm right"></div><div class="cj-body"></div><div class="cj-head"><i class="cj-hair"></i><i class="eye e1"></i><i class="eye e2"></i><i class="eye e3"></i><i class="eye e4"></i><i class="cj-nose"></i><i class="cj-mouth"></i></div></div>`}
function ensureAudio(){if(!state.sound)return null;if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur=.09,type='sine',delay=0,gain=.08){const c=ensureAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur)}
function sfx(type){if(!state.sound)return;if(type==='tap')tone(210,.045,'square',0,.025);if(type==='ok'){tone(520,.11,'sine');tone(740,.16,'sine',.08)}if(type==='bad'){tone(150,.13,'sawtooth');tone(110,.18,'sawtooth',.08)}if(type==='step'){tone(330,.08);tone(520,.1,'triangle',.07);tone(790,.14,'sine',.14)}if(type==='win'){[392,523,659,784].forEach((f,i)=>tone(f,.28,'sine',i*.11,.07))}}
/* AI 接入点 1：未来可把当前阶段、得分和操作证据提交给安全的服务端，由 AI 生成仓颉口吻评价。
   默认使用本地评价库 + 浏览器中文语音，离线也能听到仓颉夸奖。前端不要放长期 API Key。 */
function say(text,voice=true){const box=document.getElementById('guide'),gt=document.getElementById('guideText'),gc=document.getElementById('guideCj');if(!box)return;gt.textContent=text;gc.innerHTML=cj();box.classList.remove('show');requestAnimationFrame(()=>box.classList.add('show'));clearTimeout(guideTimer);guideTimer=setTimeout(()=>box.classList.remove('show'),Math.max(4200,text.length*165));if(voice&&state.sound&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.92;u.pitch=1.08;u.volume=.95;speechSynthesis.speak(u)}}
function cheer(text){sfx('ok');flash();say(text||praises[(state.score+state.task.stage)%praises.length])}function wrong(text){sfx('bad');say(text||'别急，再观察一次，你一定能找到线索。')}function flash(){const f=document.getElementById('flash');f.classList.remove('go');requestAnimationFrame(()=>f.classList.add('go'))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function top(){if(state.screen==='welcome')return '';return `<header class="topbar"><div class="brand"><i class="seal"><span>仓</span></i>仓颉仓库大冒险</div><div class="status"><span class="pill">${state.route==='high'?'🔥 高级':'🌱 初级'}</span><span class="pill">难题 ${state.completed.length}/${state.route==='high'?2:1}</span><span class="pill">⭐ ${state.score}</span><button class="sound" data-action="sound">${state.sound?'🔊 音效':'🔇 静音'}</button></div></header>`}
function shell(body){return `${top()}<div class="mountains"></div><i class="cloud c1"></i><i class="cloud c2"></i><main><section class="screen">${body}</section></main>`}
function render(){const changed=lastScreen!==state.screen;let body='';if(state.screen==='welcome')body=welcome();else if(state.screen==='prologue')body=prologue();else if(state.screen==='problems')body=problems();else if(state.screen==='task')body=task();else if(state.screen==='map')body=mapPage();else if(state.screen==='report')body=report();else if(state.screen==='end')body=end();else{state.screen='welcome';body=welcome()}document.getElementById('app').innerHTML=shell(body);bind();lastScreen=state.screen;if(changed)requestAnimationFrame(()=>scrollTo({top:0,behavior:'instant'}))}
function welcome(){return `<div class="hero card"><div class="gate"><i class="gate-glow"></i></div><div class="eyebrow">上古神州 · 文字尚未诞生</div><h1>仓颉仓库大冒险</h1><p class="lead">走进云海神仓，亲手帮仓颉建立记录、分类与盘点的秘密。</p><div class="welcome-grid"><div class="name-box"><h3>第一步 · 写下你的名字印记</h3><div class="name-row"><input id="nameInput" class="name-input" maxlength="12" value="${esc(state.name==='小管家'?'':state.name)}" placeholder="点这里输入任何名字" autocomplete="name"><button class="btn ghost" data-action="hand">✍️ 手写名字牌</button></div><p class="input-hint">平板：点输入框即可使用系统手写键盘；也可以打开下方手写板，直接写下名字印记。</p><div id="handPanel" class="hand-panel ${state.signature?'open':''}"><canvas id="signCanvas" width="680" height="180" aria-label="手写名字板"></canvas><div class="hand-tools"><span>用手指或触控笔书写</span><button class="btn ghost" data-action="clear-sign">清除</button><button class="btn jade" data-action="save-sign">收下印记</button></div></div>${state.signature?`<p>已保存名字印记：<img class="signature" src="${state.signature}" alt="手写名字"></p>`:''}</div><button class="route ${state.route==='low'?'selected':''}" data-route="low"><span class="icon">🌿</span><h3>初级神仓守护者</h3><p>适合 1—3 年级 · 选择一个难题<br>每个任务都有完整六阶段</p></button><button class="route ${state.route==='high'?'selected':''}" data-route="high"><span class="icon">🔥</span><h3>高级神仓守护者</h3><p>适合 4—6 年级 · 选择两个难题<br>更多物品、推理和复查挑战</p></button></div><div class="actions"><button class="btn fire" data-action="start">开启神仓之门</button></div></div>`}
const story=[{title:'云海中的求救声',text:'天地初开，人们把粮食、兽皮和石器送进神仓。可是东西越来越多，谁也记不住、找不到、对不上。云海深处传来仓颉的呼唤……',voice:'小管家，你终于来了！神仓越来越乱，我需要你的眼睛、双手和智慧。'},{title:'四眼仓颉现身',text:'仓颉从金色文字中一跃而下。他有四只明亮的眼睛：两只观察物品，两只寻找规律。他决定和你一起完成挑战。',voice:'我的四只眼睛负责观察，你负责作出决定。每走一步，我都会告诉你新的线索。'},{title:'领取守护者使命',text:'你可以自己决定先帮仓颉解决哪个问题。每个问题都要经历六个阶段：听任务、找线索、动手做、再检查、说原因、留下办法图。',voice:'记住，真正的智慧不是一下猜对，而是一步一步找到证据。准备好了吗？'}];
function prologue(){const x=story[state.prologue];return `<div class="prologue card"><div>${cj()}</div><div><div class="eyebrow">神话序章 ${state.prologue+1}/3</div><div class="myth-scroll"><h2>${x.title}</h2><p>${x.text}</p></div><div class="chapter-dots">${story.map((_,i)=>`<i class="${i<=state.prologue?'on':''}"></i>`).join('')}</div><div class="actions"><button class="btn ${state.prologue===2?'fire':''}" data-action="story-next">${state.prologue===2?'接受使命':'继续听故事'} ➜</button></div></div></div>`}
function problems(){return `<div class="problem-intro card">${cj()}<div><div class="eyebrow">仓颉的三道神仓难题</div><h2>${esc(state.name)}，这次先解决哪个？</h2><p class="lead">不是按顺序闯关。你自己作出选择，每个难题都有六个阶段。</p></div></div><div class="problem-grid">${Object.entries(P).map(([id,p])=>{const done=state.completed.includes(id);return `<article class="problem card ${done?'done':''}" style="--accent:${p.accent}"><span class="six-tag">六阶段任务</span><div class="problem-icon">${p.icon}</div><h2>${p.short}</h2><p>${p.desc}</p><button class="btn ${id==='record'?'fire':id==='classify'?'jade':'blue'}" data-problem="${id}" ${done?'disabled':''}>${done?'办法图已生成':`进入${p.title}任务`}</button></article>`}).join('')}</div>`}
const stageNames={record:['听清任务','识别货印','逐件验货','清点总数','编制绳结','复查封仓'],classify:['听清任务','确定标准','观察属性','整理前区','整理后区','限时找物'],audit:['听清任务','逐架实数','对照记录','算出相差','判断多寡','查因修册']};
function path(type,stage){return `<div class="quest-path">${stageNames[type].map((n,i)=>`<div class="quest-node ${i<stage?'done':i===stage?'active':''}"><span>${i<stage?'✓':i+1}</span><small>${n}</small></div>`).join('')}</div>`}
function task(){const t=state.task,p=P[t.type];return `<div class="task card"><div class="task-top"><div><div class="eyebrow">${p.icon} ${p.title}任务 · 第 ${t.stage+1}/6 阶段</div><h2>${stageNames[t.type][t.stage]}</h2></div><span class="pill">本任务 ⭐ ${taskScore()}</span></div>${path(t.type,t.stage)}<div class="stage">${t.type==='record'?recordStage():t.type==='classify'?classifyStage():auditStage()}</div></div>`}
function taskScore(){return state.task.answers.taskScore||0}function addScore(n){state.score+=n;state.task.answers.taskScore=(state.task.answers.taskScore||0)+n;save()}
function nextStage(message){state.task.stage++;const spoken=message||stageSpeech();save();render();sfx('step');setTimeout(()=>say(spoken),180)}function stageSpeech(){const t=state.task;const msg={record:['','先看货印，货印会告诉你这批货来自哪里。','现在逐件验货，易碎品和普通品要分开。','验完以后别急着走，还要核对总数。','把刚才的判断变成绳结密码。','最后复查记录，找到遗漏才能封仓。'],classify:['','先确定一种所有人都能遵守的分类标准。','每件物品都有属性，观察后再动手。','先整理第一片区域，别混用标准。','继续整理剩下的物品。','最后接受找物考验，证明你的分类真的好用。'],audit:['','先自己数货架，不能只相信记录册。','带着实数去对照记录。','找到差错后，用大数减小数。','还要说清到底是多了还是少了。','最后推测原因，并把记录修正确。']}[t.type]||[];return msg[t.stage]||'继续前进。'}
function stageActions(label='完成这一步'){return `<div class="actions"><button class="btn" data-action="stage-next">${label} ➜</button></div>`}
function recordItems(){return goods.slice(0,state.route==='high'?9:6)}
function recordStage(){const t=state.task,items=recordItems();if(t.stage===0)return `<h3>神仓门口堆满了刚运来的货物</h3><p class="stage-instruction">你要完成：看货印 → 验货 → 数总数 → 编绳结 → 查遗漏。每一步都会留下记录。</p><div class="manifest">${items.map(x=>`<span class="manifest-item"><b class="big">${x.e}</b>${x.name}</span>`).join('')}</div>${stageActions('我听清任务了')}`;
if(t.stage===1)return `<h3>哪一枚是“云东部落”的货印？</h3><p class="stage-instruction">线索：太阳从东方升起，货印上刻着日出和东向箭头。</p><div class="choice-grid"><button class="choice" data-seal="moon"><b class="big">🌙←</b>月落西山</button><button class="choice" data-seal="sun"><b class="big">🌅→</b>日出向东</button><button class="choice" data-seal="rain"><b class="big">🌧️↓</b>雨落南谷</button></div><div class="feedback">${t.answers.seal?'✓ 已确认：云东部落 · 日出货印':'观察图案与方向，再作判断'}</div>${t.answers.seal?stageActions('货印登记完成'):''}`;
if(t.stage===2){const i=t.logs.length,g=items[i];if(!g)return `<h3>全部验货完成</h3><p class="stage-instruction">你验了 ${items.length} 件，其中易碎品 ${items.filter(x=>x.fragile).length} 件。</p>${stageActions('进入总数核对')}`;return `<div class="cargo-focus"><h3>第 ${i+1}/${items.length} 件 · 判断搬运方式</h3><b class="big">${g.e}</b><h2>${g.name}</h2><p class="stage-instruction">怕摔、容易破的要轻拿轻放。它属于哪一种？</p><div class="actions"><button class="btn fire" data-fragile="1">🥚 易碎品</button><button class="btn blue" data-fragile="0">🪨 普通品</button></div><div class="rope">${t.logs.map((x,j)=>`<i class="knot" style="left:${(j+1)*100/(items.length+1)}%;--c:${x.fragile?'#ec6a66':'#68bde3'}"></i>`).join('')}</div></div>`}
if(t.stage===3){const opts=state.route==='high'?[7,8,9,10]:[4,5,6,7];return `<h3>不看答案，再数一次</h3><p class="stage-instruction">货物都验完了，这一批一共来了多少件？</p><div class="manifest">${items.map(x=>`<span class="manifest-item"><b class="big">${x.e}</b></span>`).join('')}</div><div class="actions">${opts.map(n=>`<button class="btn ghost" data-total="${n}">${n} 件</button>`).join('')}</div>${t.answers.total?stageActions('总数核对正确'):''}`}
if(t.stage===4){const i=t.knotIndex,g=items[i];if(!g)return `<h3>绳结密码编制完成</h3><p class="stage-instruction">红结表示易碎，蓝结表示普通。别人看到绳子也能读懂记录。</p><div class="rope">${items.map((x,j)=>`<i class="knot" style="left:${(j+1)*100/(items.length+1)}%;--c:${x.fragile?'#ec6a66':'#68bde3'}"></i>`).join('')}</div>${stageActions('带着绳结去复查')}`;return `<h3>为第 ${i+1}/${items.length} 件货选择绳结</h3><div class="cargo-focus"><b class="big">${g.e}</b><h2>${g.name}</h2><p class="stage-instruction">红结 = 易碎　蓝结 = 普通。根据验货结果重新编码。</p><div class="actions"><button class="btn fire" data-knot="red">🔴 红结</button><button class="btn blue" data-knot="blue">🔵 蓝结</button></div></div>`}
const missing=state.route==='high'?2:1;return `<h3>封仓前复查：哪一行漏写了？</h3><p class="stage-instruction">上面验了 ${items.length} 件，下面记录只有 ${items.length-1} 行。找出没有写进木简的货物。</p><div class="choice-grid">${items.map((g,i)=>i===missing?`<button class="choice" data-missing="${i}"><b class="big">${g.e}</b>${g.name}<br><small>木简上没有它</small></button>`:`<button class="choice" data-missing="${i}"><b class="big">${g.e}</b>${g.name}<br><small>木简：已记</small></button>`).join('')}</div>${t.answers.missing!==undefined?`<div class="feedback">✓ 找到遗漏：${items[missing].name}</div><div class="actions"><button class="btn fire" data-action="finish-task">盖上收货神印</button></div>`:''}`}

function handleKnot(k){const it=recordItems(),g=it[state.task.knotIndex],expected=g.fragile?'red':'blue';if(k!==expected)return wrong('回想刚才的规则：易碎用红结，普通用蓝结。');state.task.knotIndex++;addScore(4);save();render();if(state.task.knotIndex===it.length)cheer('你把判断变成了别人也能读懂的绳结密码！')}
function reveal(id){if(state.task.revealed.includes(id))return;state.task.revealed.push(id);addScore(2);save();render();if(state.task.revealed.length===classItems().length)cheer('全部属性观察完成，现在分类会更有依据。')}
function sortTo(group){const t=state.task;if(!t.selected)return toast('先选择一件物品');const x=classItems().find(x=>x.id===t.selected),expected=x[currentMethod().field];if(group!==expected)return wrong(`再看一次${x.name}在“${currentMethod().label}”标准下的属性。`);t.placements[x.id]=group;t.selected='';addScore(5);save();render();cheer()}
function retrieve(group){const items=classItems(),x=items.find(x=>x.id===(state.route==='high'?'hammer':'apple')),expected=x[currentMethod().field];if(group!==expected)return wrong(`根据“${currentMethod().label}”想一想，不要逐筐翻找。`);state.task.answers.retrieve=group;addScore(20);save();render();cheer('一次就定位到了正确的筐，说明你的分类真的好用！')}
function countIt(s){const [i,n]=s.split(':').map(Number),x=rows()[i];if(n!==x.actual)return wrong('用手指指着每一个图标，一个一个数。');state.task.counts[i]=n;addScore(6);save();render();cheer()}
function mark(i){const x=rows()[i],bad=x.actual!==x.book;if(!bad)return wrong('这一行实数和记录相同，不需要标记。');if(!state.task.marked.includes(i)){state.task.marked.push(i);addScore(10);save();render();cheer('找到一处差错，继续看看还有没有。')}}
function diffIt(s){const [i,n]=s.split(':').map(Number),x=rows()[i],d=Math.abs(x.actual-x.book);if(n!==d)return wrong('求相差，要用较大的数减较小的数。');state.task.diffs[i]=n;addScore(10);save();render();cheer('差值算对了，但还要判断是多还是少。')}
function direction(s){const [i,v]=s.split(':'),x=rows()[+i],expected=x.actual>x.book?'多':'少';if(v!==expected)return wrong('先看“实际”这一边，它比记录的大还是小？');state.task.directions[i]=v;addScore(10);save();render();cheer('方向也判断清楚了，修记录就有依据了。')}
function reason(r){if(r!=='漏记')return wrong('神话故事可以有想象，但仓库原因要能在真实操作中发生。');state.task.reason=r;addScore(20);save();render();cheer('找到了最可能的原因：进出货后没有及时登记。')}
function action(id){if(id==='sound'){state.sound=!state.sound;if(!state.sound&&'speechSynthesis'in window)speechSynthesis.cancel();save();render();if(state.sound){sfx('ok');say('声音已经打开，我会继续陪你冒险。')}return}if(id==='hand'){document.getElementById('handPanel').classList.toggle('open');setupCanvas();return}if(id==='clear-sign'){clearCanvas();state.signature='';save();return}if(id==='save-sign'){const c=document.getElementById('signCanvas');if(c)state.signature=c.toDataURL('image/png');save();render();toast('名字印记已保存');return}if(id==='start'){const input=document.getElementById('nameInput'),name=input.value.trim();if(!name&&!state.signature)return toast('请先输入名字，或写下名字印记');if(!state.route)return toast('请选择一条守护者路线');state={...blank(),name:name||'小管家',signature:state.signature,route:state.route,screen:'prologue',started:true,sound:state.sound};save();ensureAudio();render();setTimeout(()=>say(story[0].voice),180);return}if(id==='story-next'){if(state.prologue<2){state.prologue++;save();render();setTimeout(()=>say(story[state.prologue].voice),150)}else{state.screen='problems';save();render();setTimeout(()=>say('三个问题都没有固定顺序，你自己决定先帮助我解决哪一个。'),150)}return}if(id==='stage-next'){nextStage();return}if(id==='finish-task'){complete();return}if(id==='continue'){state.screen='problems';save();render();setTimeout(()=>say('第一张办法图已经收好。现在选择另一个还没有解决的问题。'),150);return}if(id==='report-locked'){toast('高级守护者要完成两个六阶段任务');say('再完成一个问题，你就会带着两份证据上台。');return}if(id==='report'){state.screen='report';save();render();return}if(id==='back-map'){state.screen='map';save();render();return}if(id==='rehearse'){say(`大家好，我叫${state.name}。我帮仓颉解决了${mapData().solved}问题。我不是一下猜出来的，而是经过六个阶段，一步一步找到证据。`);return}if(id==='praise'){say(`${state.name}，${praises[Math.floor(Math.random()*praises.length)]}`);return}if(id==='polish'){const d=document.getElementById('mapDetail');if(d)d.innerHTML='✨ 上台可以这样说：我先观察，再按标准行动，最后用复查证明结果，所以我的办法不是猜出来的。';say('我已经把你的表达变得更有证据感了。');return}if(id==='ask'){ask();return}if(id==='ready'){state.score+=60;state.screen='end';save();render();sfx('win');setTimeout(()=>say(`${state.name}，你已经准备好了。带着你的办法图，大声讲出自己的发现吧！`),200);return}if(id==='restart'){const sound=state.sound;state=blank();state.sound=sound;save();render();return}if(id==='save-map'){downloadMap();return}}
/* AI 接入点 3：汇报问题未来可发送到受控服务端；默认关键词规则已覆盖紧张、忘词、声音小。 */
function ask(){const q=document.getElementById('askInput').value.trim(),a=document.getElementById('answer');if(!q)return toast('先写下你担心的事');let t='指着办法图，一朵云一朵云地讲。一次只说一步，就不会乱。';if(/紧张|害怕|不敢/.test(q))t='脚站稳，先慢慢吸气、呼气三次。看着一位微笑的同学，只说第一句，后面就会自然跟上。';else if(/忘/.test(q))t='忘词时就指下一朵云，说“接下来我做了……”。办法图就是你的提词卡。';else if(/小声|声音/.test(q))t='抬起头，把声音送到教室最后一排。每说完一句停半秒。';a.textContent=t;a.style.display='block';say(t)}
function setupCanvas(){const c=document.getElementById('signCanvas');if(!c||c.dataset.ready)return;c.dataset.ready='1';const x=c.getContext('2d');x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#3c2830';x.fillStyle='#fffdf2';x.fillRect(0,0,c.width,c.height);if(state.signature){const img=new Image();img.onload=()=>x.drawImage(img,0,0,c.width,c.height);img.src=state.signature}const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]};const down=e=>{e.preventDefault();canvasDrawing=true;const [a,b]=pos(e);x.beginPath();x.moveTo(a,b)};const move=e=>{if(!canvasDrawing)return;e.preventDefault();const [a,b]=pos(e);x.lineTo(a,b);x.stroke()};const up=()=>canvasDrawing=false;c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}function clearCanvas(){const c=document.getElementById('signCanvas');if(!c)return;const x=c.getContext('2d');x.fillStyle='#fffdf2';x.fillRect(0,0,c.width,c.height)}
/* AI 接入点 2：未来可让服务端返回与 mapData.b 相同结构的润色结果；默认保留孩子真实操作数据。 */
function downloadMap(){const m=mapData(),colors=['#edb65d','#83cfb3','#79bfe4','#d897b4'];const ps=[[45,65],[675,65],[45,360],[675,360]];const bs=m.b.map((x,i)=>`<g><rect x="${ps[i][0]}" y="${ps[i][1]}" width="280" height="125" rx="40" fill="${colors[i]}" stroke="#ffe8a8" stroke-width="7"/><text x="${ps[i][0]+140}" y="${ps[i][1]+52}" text-anchor="middle" font-size="25" font-weight="bold">${xml(x[0]+' '+x[1])}</text><text x="${ps[i][0]+140}" y="${ps[i][1]+88}" text-anchor="middle" font-size="16">${xml(x[2].slice(0,19))}</text></g>`).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620"><rect width="1000" height="620" rx="35" fill="#151c3d"/><text x="500" y="38" fill="#f7cf68" text-anchor="middle" font-size="24">${xml(state.name)}的神仓办法图</text><path d="M325 125L420 245M675 125L580 245M325 420L420 335M675 420L580 335" stroke="#d9a348" stroke-width="12"/>${bs}<ellipse cx="500" cy="295" rx="155" ry="105" fill="#e1aa49" stroke="#ffe9a6" stroke-width="9"/><text x="500" y="282" text-anchor="middle" font-size="42">${m.icon}</text><text x="500" y="330" text-anchor="middle" font-size="27" font-weight="bold">${xml(m.title)}</text></svg>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=`${state.name}-${m.title}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('办法图已经保存')}
function xml(s){return esc(s).replace(/'/g,'&apos;')}
window.__CANGJIE_V2__={state:()=>JSON.parse(JSON.stringify(state)),reset:()=>{state=blank();save();render()},startTask,mapData,version:'2.0.0'};render();
})();
