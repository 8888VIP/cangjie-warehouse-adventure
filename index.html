<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#7d3f1e">
  <title>仓颉仓库大冒险</title>
  <style>
    :root{
      --ink:#3d291c;--muted:#765b47;--cream:#fff7df;--paper:#fffdf4;--wood:#8b4a27;
      --wood-dark:#5f2f19;--green:#58a85e;--green-dark:#23703c;--orange:#f28b31;

    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f6d89a}
    button,input{font:inherit}button{touch-action:manipulation}
    body{min-height:100vh;overflow-x:hidden;background:
      radial-gradient(circle at 10% 12%,rgba(255,255,255,.38) 0 4px,transparent 5px),
      linear-gradient(180deg,#f7c978 0%,#ffe6ac 56%,#d99b58 100%);background-size:38px 38px,auto}
    body:before,body:after{content:"";position:fixed;z-index:-1;bottom:0;width:34vw;height:38vh;background:#87512d;clip-path:polygon(0 100%,20% 55%,34% 69%,52% 19%,68% 66%,84% 42%,100% 100%);opacity:.34}
    body:before{left:0}body:after{right:0;transform:scaleX(-1)}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .topbar{height:78px;padding:10px clamp(14px,3vw,42px);display:flex;align-items:center;justify-content:space-between;background:rgba(255,249,228,.87);backdrop-filter:blur(10px);border-bottom:4px solid rgba(110,61,27,.18);position:sticky;top:0;z-index:20}
    .brand{font-weight:1000;font-size:clamp(18px,2.3vw,29px);display:flex;gap:10px;align-items:center}.brand-mark{font-size:35px;filter:drop-shadow(0 4px 0 rgba(98,49,21,.16))}
    .status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fff;border:2px solid #e2bd80;border-radius:999px;padding:8px 14px;font-weight:900;white-space:nowrap}.score-pill{background:var(--yellow)}
    main{width:min(1240px,100%);margin:auto;padding:clamp(18px,3vw,42px);flex:1;display:flex;align-items:center}
    .screen{width:100%;animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
    @keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(34px,5vw,64px);line-height:1.08;margin-bottom:14px}h2{font-size:clamp(27px,3.8vw,46px);line-height:1.15}h3{font-size:clamp(20px,2.3vw,29px)}
    .eyebrow{font-size:16px;font-weight:1000;letter-spacing:2px;color:var(--orange-dark);margin-bottom:9px}.lead{font-size:clamp(18px,2vw,25px);line-height:1.6;color:var(--muted);font-weight:700}
    .card{background:rgba(255,253,244,.97);border:4px solid #fff0bd;border-radius:var(--radius);box-shadow:var(--shadow)}
    .btn{min-height:62px;border:0;border-radius:18px;padding:14px 24px;font-weight:1000;font-size:clamp(17px,1.7vw,22px);cursor:pointer;color:#fff;background:var(--wood);box-shadow:0 7px 0 var(--wood-dark);transition:.16s transform,.16s filter;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
    .btn:hover{filter:brightness(1.06);transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--wood-dark)}.btn:focus-visible{outline:5px solid #2b77ff;outline-offset:3px}
    .btn.primary{background:var(--orange);box-shadow:0 7px 0 var(--orange-dark)}.btn.green{background:var(--green);box-shadow:0 7px 0 var(--green-dark)}.btn.blue{background:var(--blue);box-shadow:0 7px 0 #286b9c}.btn.ghost{background:#fff;color:var(--ink);border:3px solid #c58e58;box-shadow:0 6px 0 #c58e58}.btn:disabled{filter:grayscale(.8);opacity:.58;cursor:not-allowed;transform:none}
    .actions{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:24px}
    .route-layout{display:grid;grid-template-columns:1fr 1fr;min-height:610px;overflow:hidden}.route-intro{grid-column:1/-1;text-align:center;padding:28px 20px 12px}.route-side{padding:24px clamp(20px,4vw,52px);display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}.route-side.low{background:linear-gradient(145deg,#e8f7c8,#bce79e)}.route-side.high{background:linear-gradient(145deg,#ffe4b7,#ffc073)}.route-icon{font-size:74px;animation:float 2.5s ease-in-out infinite}.route-side.high .route-icon{animation-delay:.35s}@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}
    .name-panel{background:#fff9df;border:3px dashed #b97838;border-radius:22px;padding:14px;width:min(530px,94%);display:flex;gap:10px;align-items:center}.name-panel span{font-weight:900}.name-input{flex:1;min-width:0;height:55px;border:3px solid #e3b167;border-radius:15px;padding:0 16px;font-size:25px;font-weight:900;background:#fff;text-align:center}
    .keyboard{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(520px,94%)}.key{min-width:55px;min-height:55px;background:#fff;border:2px solid #e0b877;border-radius:14px;box-shadow:0 4px 0 #c89451;font-weight:1000;font-size:19px;cursor:pointer}.key.wide{grid-column:span 2}.key:active{transform:translateY(3px);box-shadow:0 1px 0 #c89451}
    .route-choice{width:100%;min-height:195px;border:5px solid transparent;border-radius:25px;background:rgba(255,255,255,.72);padding:22px;cursor:pointer;text-align:left;transition:.2s;position:relative}.route-choice:hover,.route-choice.selected{transform:translateY(-5px);background:#fff;border-color:var(--wood)}.route-choice.selected:after{content:"✓ 已选择";position:absolute;right:14px;top:14px;background:var(--wood);color:white;border-radius:999px;padding:6px 12px;font-weight:900}.route-choice h3{font-size:28px;margin-bottom:9px}.route-choice p{font-size:18px;line-height:1.55;margin:0;color:var(--muted);font-weight:700}
    .resume{grid-column:1/-1;text-align:center;padding:14px;background:#fff6d9;border-top:3px dashed #d2a56c}
    .guide{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center;margin-bottom:28px;padding:22px 28px}.speech{background:#fff;border:3px solid #d29b61;border-radius:26px;padding:22px;font-size:clamp(18px,2.1vw,27px);font-weight:900;line-height:1.5;position:relative}.speech:before{content:"";position:absolute;left:-22px;top:45%;border:12px solid transparent;border-right-color:#d29b61}.speech:after{content:"";position:absolute;left:-16px;top:45%;border:12px solid transparent;border-right-color:#fff}
    .cangjie{width:150px;height:170px;margin:auto;position:relative}.cj-head{position:absolute;width:112px;height:104px;left:19px;top:5px;background:#f2b56d;border:5px solid #62391e;border-radius:46% 46% 42% 42%;box-shadow:inset 0 -10px 0 rgba(164,83,35,.18)}.cj-hair{position:absolute;left:12px;top:-11px;width:85px;height:32px;background:#4c2c1c;border-radius:60% 40% 20% 20%;transform:rotate(-4deg)}.eye{position:absolute;width:18px;height:20px;background:white;border:3px solid #542b18;border-radius:50%}.eye:after{content:"";position:absolute;width:7px;height:8px;background:#2a1a13;border-radius:50%;left:3px;top:4px}.e1{left:24px;top:28px}.e2{right:24px;top:28px}.e3{left:31px;top:52px}.e4{right:31px;top:52px}.nose{position:absolute;left:49px;top:67px;width:14px;height:10px;border-bottom:3px solid #8e4b28;border-radius:50%}.mouth{position:absolute;left:38px;top:81px;width:35px;height:13px;border-bottom:5px solid #8d331f;border-radius:50%}.cj-body{position:absolute;left:25px;top:99px;width:100px;height:70px;background:#9a572d;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-radius:18px}.cj-body:after{content:"◆ ◆ ◆";position:absolute;color:#ffd278;top:16px;left:11px;font-size:16px}.cj-arm{position:absolute;width:53px;height:18px;background:#f2b56d;border:4px solid #62391e;border-radius:20px;top:112px}.cj-arm.left{left:0;transform:rotate(25deg)}.cj-arm.right{right:0;transform:rotate(-25deg)}
    .problems{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.problem{padding:25px;display:flex;flex-direction:column;min-height:390px;position:relative;overflow:hidden}.problem:before{content:"";position:absolute;inset:0 0 auto;height:10px;background:var(--accent)}.problem-icon{font-size:70px;margin:8px 0 14px;filter:drop-shadow(0 5px 0 rgba(90,50,28,.12))}.problem p{font-size:18px;line-height:1.65;color:var(--muted);font-weight:700;flex:1}.problem.done{background:#eef9e5;border-color:#9ed184}.problem.done:after{content:"✓ 已解决";position:absolute;top:16px;right:-38px;background:var(--green);color:#fff;padding:8px 46px;transform:rotate(35deg);font-weight:1000}.bottom-tip{text-align:center;margin:25px 0 0;font-weight:1000;font-size:21px}.progress-dots{display:flex;gap:9px;justify-content:center;margin:15px}.dot{width:18px;height:18px;border-radius:50%;background:#e4c99d;border:3px solid #fff}.dot.done{background:var(--green)}
    .task-shell{padding:26px}.task-heading{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:3px dashed #d4af79;padding-bottom:18px;margin-bottom:22px}.task-heading p{margin:0}.scene{background:linear-gradient(#ebc986 0 58%,#9f6234 59% 100%);border:5px solid #754021;border-radius:24px;min-height:390px;padding:22px;position:relative;overflow:hidden}.scene:before{content:"";position:absolute;left:4%;right:4%;top:26px;height:125px;background:repeating-linear-gradient(90deg,#8d542e 0 18px,#a96b3d 18px 36px);border:7px solid #603619;opacity:.55}
    .cargo-layout{display:grid;grid-template-columns:1.5fr .75fr;gap:20px;position:relative;z-index:1}.cargo-card{background:#fff9e7;border:4px solid #7e4929;border-radius:24px;min-height:315px;display:grid;place-items:center;text-align:center;padding:20px}.cargo-emoji{font-size:100px;animation:cargoIn .35s}@keyframes cargoIn{from{transform:translateX(-140px) rotate(-12deg);opacity:0}}.cargo-name{font-size:29px;font-weight:1000}.cargo-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.rope-panel{background:#fff3c6;border:4px solid #8c542e;border-radius:24px;padding:18px;text-align:center}.rope{width:18px;height:230px;background:linear-gradient(90deg,#a86a31,#f4c267,#8c4e23);border-radius:12px;margin:8px auto;position:relative}.knot{position:absolute;left:50%;transform:translate(-50%,-50%);width:43px;height:24px;border:7px solid var(--knot,#8b4e25);border-radius:50%;animation:knotPop .35s}.knot:after{content:"";position:absolute;width:20px;border-top:6px solid var(--knot,#8b4e25);left:20px;top:6px;transform:rotate(22deg)}@keyframes knotPop{from{transform:translate(-50%,-50%) scale(.2)}}
    .knowledge{margin-top:18px;padding:14px 18px;background:#fff8d6;border:3px solid #f0bc4c;border-radius:18px;font-size:17px;font-weight:900;animation:pop .4s}@keyframes pop{50%{transform:scale(1.02)}}
    .classify-setup{text-align:center;position:relative;z-index:1;background:rgba(255,252,234,.92);padding:22px;border-radius:22px}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.method{min-height:120px;background:#fff;border:4px solid #deb068;border-radius:20px;font-weight:1000;font-size:20px;cursor:pointer}.method.selected{border-color:var(--green);background:#e8f7d7;transform:translateY(-4px)}
    .sort-area{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:18px}.items-tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(255,248,219,.94);border-radius:22px;padding:16px;min-height:112px}.item-chip{min-width:92px;min-height:78px;border:4px solid #9c6032;border-radius:18px;background:#fff9e8;font-size:16px;font-weight:900;cursor:pointer;padding:8px}.item-chip .emoji{display:block;font-size:34px}.item-chip.selected{outline:6px solid #2f8bc6;transform:translateY(-5px)}.item-chip.placed{opacity:.2;pointer-events:none}.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.basket{min-height:180px;border:6px solid #764522;border-top:20px solid #764522;border-radius:13px 13px 35px 35px;background:repeating-linear-gradient(45deg,#d99a4a 0 12px,#efbd68 12px 24px);padding:14px;text-align:center;cursor:pointer}.basket h3{background:#fff6d5;border-radius:13px;padding:7px;margin-bottom:10px}.basket-items{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-size:32px}
    .audit-layout{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.shelf,.ledger{background:rgba(255,251,233,.95);border:4px solid #70401f;border-radius:22px;padding:18px}.audit-row{display:grid;grid-template-columns:105px 1fr 80px;gap:10px;align-items:center;border-bottom:2px dashed #cba469;padding:12px}.things{font-size:25px;letter-spacing:3px}.ledger-row{width:100%;min-height:65px;border:3px solid #d9ae70;background:#fff;border-radius:14px;margin-bottom:10px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;cursor:pointer}.ledger-row.correct{background:#e2f5d8;border-color:#79b460}.ledger-row.wrong{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.followup{background:#fff4cf;border:4px solid #d69344;border-radius:20px;padding:18px;margin-top:16px}.option-grid{display:flex;gap:10px;flex-wrap:wrap}.option{min-height:60px;min-width:90px;border:3px solid #d1a064;background:#fff;border-radius:15px;font-weight:900;cursor:pointer}.option.selected{background:#dff1ff;border-color:#3986ba}
    .map-page{display:grid;gap:22px}.praise{display:grid;grid-template-columns:115px 1fr auto;gap:18px;align-items:center;padding:18px 22px}.praise .cangjie{transform:scale(.7);width:105px;height:120px;transform-origin:left center}.praise-text{font-size:21px;line-height:1.55;font-weight:900}.map-wrap{padding:24px;overflow:hidden}.map-title{text-align:center}.bubble-map{position:relative;min-height:510px;display:grid;place-items:center}.center-bubble,.branch-bubble{position:absolute;border:5px solid white;box-shadow:0 9px 0 rgba(77,47,25,.13),0 12px 25px rgba(77,47,25,.12);display:grid;place-items:center;text-align:center;font-weight:1000;cursor:pointer;z-index:2;transition:.2s}.center-bubble{width:250px;min-height:150px;border-radius:48% 52% 50% 45%;background:var(--yellow);font-size:25px;padding:20px}.branch-bubble{width:220px;min-height:115px;border-radius:47% 53% 45% 55%;font-size:18px;padding:16px;background:var(--bubble)}.branch-bubble:hover{transform:scale(1.06)}.b0{left:3%;top:7%}.b1{right:3%;top:7%}.b2{left:4%;bottom:7%}.b3{right:4%;bottom:7%}.vine{position:absolute;height:12px;background:#7ea957;border:3px solid #fff;border-radius:99px;z-index:1;transform-origin:left center}.v0{width:33%;left:20%;top:29%;transform:rotate(20deg)}.v1{width:33%;left:50%;top:31%;transform:rotate(-20deg)}.v2{width:33%;left:21%;top:68%;transform:rotate(-19deg)}.v3{width:33%;left:50%;top:67%;transform:rotate(20deg)}.detail-drawer{min-height:78px;background:#fff8dc;border:3px dashed #d29851;border-radius:19px;padding:16px 20px;text-align:center;font-size:19px;font-weight:900}
    .report-layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}.mini-map{min-height:360px;background:linear-gradient(145deg,#eaf6d3,#fff4c8);padding:24px;text-align:center}.mini-center{margin:55px auto 30px;width:200px;padding:22px;background:var(--yellow);border-radius:50%;font-size:22px;font-weight:1000;border:5px solid white;box-shadow:var(--shadow)}.mini-branches{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.mini-branches span{background:#fff;border:3px solid #94bd6a;border-radius:999px;padding:9px 13px;font-weight:900}.tips{padding:26px}.tip{display:grid;grid-template-columns:50px 1fr;gap:13px;align-items:center;background:#fff7da;border-radius:18px;margin:12px 0;padding:13px;font-size:18px;font-weight:900}.tip-no{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--orange);font-size:23px}.assistant-box{margin-top:18px;border-top:3px dashed #d7ad74;padding-top:18px}.ask-row{display:flex;gap:9px}.ask-row input{flex:1;min-width:0;height:62px;border:3px solid #c99657;border-radius:16px;padding:0 15px;font-size:18px}.assistant-answer{margin-top:10px;background:#e8f6ff;border-radius:15px;padding:13px;font-weight:800;display:none}
    .medal-page{text-align:center}.medal{width:260px;height:260px;border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;background:radial-gradient(circle,#fff18d 0 23%,#f8bd34 24% 55%,#e17c21 56%);border:12px solid #fff1aa;box-shadow:0 0 0 12px #bd5422,var(--shadow);position:relative;animation:medalIn .75s cubic-bezier(.2,1.5,.5,1)}@keyframes medalIn{from{transform:scale(.1) rotate(-180deg)}}.medal:before,.medal:after{content:"";position:absolute;bottom:-82px;width:85px;height:115px;background:#e35841;z-index:-1;clip-path:polygon(0 0,100% 0,82% 100%,50% 78%,18% 100%)}.medal:before{left:28px;transform:rotate(12deg)}.medal:after{right:28px;transform:rotate(-12deg)}.medal-inner{font-size:67px;line-height:1}.medal-inner strong{display:block;font-size:24px;margin-top:9px}.summary-cards{display:flex;justify-content:center;gap:18px;margin:90px auto 22px;flex-wrap:wrap}.summary{min-width:190px;background:white;border:4px solid #f3bd55;border-radius:22px;padding:18px}.summary b{display:block;font-size:37px;color:var(--orange-dark)}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);opacity:0;pointer-events:none;background:#3b291e;color:white;border-radius:16px;padding:14px 22px;font-weight:900;z-index:100;transition:.3s;box-shadow:0 8px 25px rgba(0,0,0,.22)}.toast.show{transform:translate(-50%,0);opacity:1}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}.confetti i{position:absolute;top:-20px;width:12px;height:22px;background:var(--c);animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(700deg)}}
    .modal-backdrop{position:fixed;inset:0;background:rgba(53,31,17,.64);display:grid;place-items:center;z-index:80;padding:20px}.modal{max-width:560px;width:100%;padding:26px;text-align:center}.modal .big{font-size:70px}.hidden{display:none!important}

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
/*
  仓颉仓库大冒险：零依赖单文件版
  图片替换提示：页面中的 emoji 与 .cangjie CSS 角色都可替换为本地 PNG/SVG；
  若替换，请使用相对路径并将图片与 index.html 一起保存。
*/
(() => {
  'use strict';
  const STORAGE_KEY='cangjieWarehouse:v1';
  const newTransient=()=>({cargoIndex:0,cargoLog:[],sortMethod:'',placements:{},auditFound:[],auditStep:null,auditReason:'',auditDiff:null,detailIndex:0,selectedItem:null});
  const defaultState=()=>({name:'',route:'',screen:'welcome',score:0,completed:[],results:{},currentTask:'',lastMap:'',started:false,taskState:newTransient()});
  let state=load();
  let transient={...newTransient(),...(state.taskState||{})};

  const problems={
    record:{icon:'📦',short:'记不住',title:'记录',desc:'东西太多了，我记不住有多少、什么时候来的',button:'帮他记录',accent:'#e89038'},
    classify:{icon:'🗂️',short:'找不到',title:'分类',desc:'东西乱摆，要用的时候怎么都找不到',button:'帮他分类',accent:'#56a967'},
    audit:{icon:'🔍',short:'对不上',title:'盘点',desc:'记录的和实际的不一样，不知道哪里错了',button:'帮他盘点',accent:'#4c98cb'}
  };
  const cargos=[
    {name:'陶罐',emoji:'🏺',type:'fragile'},{name:'石斧',emoji:'🪓',type:'normal'},{name:'鸟蛋',emoji:'🥚',type:'fragile'},
    {name:'草编篮',emoji:'🧺',type:'normal'},{name:'果子',emoji:'🍎',type:'normal'},{name:'陶碗',emoji:'🥣',type:'fragile'},
    {name:'木棒',emoji:'🪵',type:'normal'},{name:'水罐',emoji:'🏺',type:'fragile'}
  ];
  const sortItems=[
    {id:'grain',name:'谷穗',emoji:'🌾',use:'食物',material:'植物',size:'小件'},
    {id:'apple',name:'果子',emoji:'🍎',use:'食物',material:'植物',size:'小件'},
    {id:'meat',name:'肉干',emoji:'🍖',use:'食物',material:'动物',size:'小件'},
    {id:'axe',name:'石斧',emoji:'🪓',use:'工具',material:'石头',size:'中件'},
    {id:'hammer',name:'石锤',emoji:'🔨',use:'工具',material:'石头',size:'中件'},
    {id:'wood',name:'木棒',emoji:'🪵',use:'工具',material:'植物',size:'大件'},
    {id:'hide',name:'兽皮衣',emoji:'🥋',use:'衣物',material:'动物',size:'大件'},
    {id:'scarf',name:'草披肩',emoji:'🧣',use:'衣物',material:'植物',size:'中件'},
    {id:'shoe',name:'皮靴',emoji:'🥾',use:'衣物',material:'动物',size:'中件'},
    {id:'pot',name:'陶罐',emoji:'🏺',use:'容器',material:'泥土',size:'大件'},
    {id:'basket',name:'草篮',emoji:'🧺',use:'容器',material:'植物',size:'大件'},
    {id:'bowl',name:'石碗',emoji:'🥣',use:'容器',material:'石头',size:'小件'}
  ];
  const methods={
    use:{label:'按用途分类',icon:'🎯',groups:['食物','生产工具','生活用品'],field:'use'},
    material:{label:'按材质分类',icon:'🪨',groups:['植物','动物','石土'],field:'material'},
    size:{label:'按大小分类',icon:'📏',groups:['小件','中件','大件'],field:'size'}
  };
  const auditData={
    low:[{name:'果子',emoji:'🍎',actual:4,book:4},{name:'石斧',emoji:'🪓',actual:3,book:5},{name:'兽皮',emoji:'🟫',actual:2,book:2}],
    high:[{name:'果子',emoji:'🍎',actual:6,book:8,reason:'搬运时漏记了'},{name:'石斧',emoji:'🪓',actual:4,book:4,reason:''},{name:'兽皮',emoji:'🟫',actual:5,book:3,reason:'出库后忘记登记'},{name:'陶罐',emoji:'🏺',actual:2,book:2,reason:''}]
  };
  const praiseTemplates=[
    '你像真正的小管家一样，眼睛亮、脑子快，还把办法讲得清清楚楚！',
    '你的每一步都有证据，这份办法图就是你认真思考的脚印！',
    '你没有乱猜，而是动手试、仔细看，仓库因为你变得更有秩序啦！',
    '你把一个大难题拆成了小步骤，这就是聪明的小管家办法！',
    '你发现了数字和物品之间的秘密，仓颉要向你学习啦！',
    '你的分类又清楚又好找，以后仓库里的伙伴都能少走弯路！',
    '每一个绳结都记着你的认真，古老的办法被你重新用活啦！',
    '你不只完成了任务，还做出了能上台讲给大家听的办法图！',
    '遇到不一样的数量，你会核对、会解释，真有小侦探的样子！',
    '你选择了自己的路，也坚持完成了它，这份勇气值得大大表扬！'
  ];

  function load(){try{return {...defaultState(),...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch(e){return defaultState()}}
  function save(){state.taskState=transient;localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
  function setState(patch){state={...state,...patch};save();render()}
  function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2500)}
  function confetti(){const box=document.getElementById('confetti');box.innerHTML='';for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.setProperty('--x',(Math.random()*240-120)+'px');p.style.setProperty('--c',['#ffcb48','#ef6c43','#5fb967','#4f9bd2','#a85ba7'][i%5]);p.style.animationDelay=Math.random()*.5+'s';box.appendChild(p)}setTimeout(()=>box.innerHTML='',2400)}
  function cangjie(){return `<div class="cangjie" role="img" aria-label="可爱的四眼仓颉"><div class="cj-arm left"></div><div class="cj-arm right"></div><div class="cj-body"></div><div class="cj-head"><div class="cj-hair"></div><i class="eye e1"></i><i class="eye e2"></i><i class="eye e3"></i><i class="eye e4"></i><i class="nose"></i><i class="mouth"></i></div></div>`}
  function header(){if(state.screen==='welcome')return '';const need=state.route==='high'?2:1;return `<header class="topbar"><div class="brand"><span class="brand-mark">🏕️</span>仓颉仓库大冒险</div><div class="status"><span class="pill route-label">${state.route==='high'?'🔥 高级大管家':'🌱 初级小管家'}</span><span class="pill">难题 ${state.completed.length}/${need}</span><span class="pill score-pill">⭐ ${state.score}分</span></div></header>`}
  let lastRenderedScreen='';
  function render(){const screenChanged=lastRenderedScreen!==state.screen;const app=document.getElementById('app');let html='';switch(state.screen){case'welcome':html=welcome();break;case'problems':html=problemScreen();break;case'task-record':html=recordTask();break;case'task-classify':html=classifyTask();break;case'task-audit':html=auditTask();break;case'map':html=mapScreen();break;case'report':html=reportScreen();break;case'end':html=endScreen();break;default:state.screen='welcome';html=welcome()}app.innerHTML=header()+`<main><section class="screen">${html}</section></main>`;bind();lastRenderedScreen=state.screen;if(screenChanged)requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'instant'}));}

  function welcome(){
    const resume=state.started&&state.name?`<div class="resume">👋 ${esc(state.name)}，上次的冒险还在！ <button class="btn ghost" data-action="resume">继续上次冒险</button></div>`:'';
    return `<div class="route-layout card"><div class="route-intro"><div class="eyebrow">一座混乱的远古仓库 · 等你来帮忙</div><h1>欢迎来到仓颉的仓库！</h1><div class="name-panel"><span>我的名字</span><input class="name-input" id="nameInput" value="${esc(state.name)}" maxlength="8" placeholder="点下面的字来输入" readonly></div><div class="keyboard" aria-label="虚拟键盘">${'小明华乐安可天宇林雨欣阳浩晨希然'.split('').map(x=>`<button class="key" data-key="${x}">${x}</button>`).join('')}<button class="key wide" data-key="delete">⌫ 删除</button><button class="key wide" data-key="clear">清空</button></div></div><div class="route-side low"><div class="route-icon">🌱</div><button class="route-choice ${state.route==='low'?'selected':''}" data-route="low"><h3>初级小管家</h3><p>适合 1—3 年级<br>帮仓颉解决 <b>1 个</b>难题<br>任务更简单，办法图更清楚</p></button></div><div class="route-side high"><div class="route-icon">🔥</div><button class="route-choice ${state.route==='high'?'selected':''}" data-route="high"><h3>高级大管家</h3><p>适合 4—6 年级<br>帮仓颉解决 <b>2 个</b>难题<br>任务更烧脑，办法图更丰富</p></button></div><div class="actions" style="grid-column:1/-1;padding:0 20px 24px"><button class="btn primary" data-action="start">🚪 开始帮忙</button></div>${resume}</div>`;
  }
  function problemScreen(){const need=state.route==='high'?2:1;return `<div class="guide card">${cangjie()}<div class="speech">${esc(state.name)}小管家，我遇到了好多问题，你想先帮我解决哪个？</div></div><div class="progress-dots">${Array.from({length:need},(_,i)=>`<i class="dot ${i<state.completed.length?'done':''}"></i>`).join('')}</div><div class="problems">${Object.entries(problems).map(([id,p])=>{const done=state.completed.includes(id);return `<article class="problem card ${done?'done':''}" style="--accent:${p.accent}"><div class="problem-icon">${p.icon}</div><h2>${p.short}</h2><p>${p.desc}</p><button class="btn ${id==='classify'?'green':id==='audit'?'blue':'primary'}" data-problem="${id}" ${done?'disabled':''}>${done?'已经解决':p.button}</button></article>`}).join('')}</div><p class="bottom-tip">${state.route==='high'?`你要解决两个问题，已经完成 ${state.completed.length} 个。选一个还没解决的吧！`:'选一个你最想解决的问题吧！'}</p></div>`}

  function startProblem(id){if(state.completed.includes(id))return;transient=newTransient();state.currentTask=id;state.screen='task-'+id;save();render()}

  function recordTask(){const count=state.route==='high'?8:5;const item=cargos[transient.cargoIndex];const knots=transient.cargoLog.map((x,i)=>`<i class="knot" style="top:${15+i*(190/Math.max(1,count-1))}px;--knot:${x.type==='fragile'?'#e45e52':'#4e9bd0'}" title="${x.name}"></i>`).join('');const done=transient.cargoIndex>=count;return `<div class="task-shell card"><div class="task-heading"><div><div class="eyebrow">任务 · 解决“记不住”</div><h2>🚚 收货清点与结绳记事</h2><p class="lead">${state.route==='high'?'判断货物是易碎品还是普通品，分类签收。':'每来一件货物就点“签收”，看看绳子发生什么变化。'}</p></div><span class="pill">已收 ${Math.min(transient.cargoIndex,count)}/${count}</span></div><div class="scene"><div class="cargo-layout">${done?`<div class="cargo-card"><div><div class="cargo-emoji">🎉</div><div class="cargo-name">全部签收完成！</div><p>绳结帮我们记住了每一件货物。</p><button class="btn primary" data-action="finish-record">生成我的记录图</button></div></div>`:`<div class="cargo-card"><div><div class="cargo-emoji">${item.emoji}</div><div class="cargo-name">${item.name}</div><p>${state.route==='high'?'看仔细，它怕不怕摔？':'这件货物刚刚运到仓库门口'}</p><div class="cargo-actions">${state.route==='high'?`<button class="btn primary" data-cargo-type="fragile">🥚 易碎品</button><button class="btn blue" data-cargo-type="normal">✅ 普通品</button>`:`<button class="btn green" data-cargo-type="${item.type}">✅ 签收</button>`}</div></div></div>`}<aside class="rope-panel"><b>我的记事绳</b><div class="rope">${knots}</div><div>绳结：${transient.cargoLog.length} 个</div>${state.route==='high'?'<small>🔴 易碎　🔵 普通</small>':''}</aside></div></div>${transient.cargoLog.length===1?`<div class="knowledge">💡 仓颉就是用打绳结的方法记录的哦！大事打大结，小事打小结～</div>`:''}</div>`}

  function classifyTask(){const isHigh=state.route==='high';const lowIds=['grain','apple','axe','hammer','hide','scarf'];const items=isHigh?sortItems:sortItems.filter(x=>lowIds.includes(x.id));if(isHigh&&!transient.sortMethod)return `<div class="task-shell card"><div class="task-heading"><div><div class="eyebrow">任务 · 解决“找不到”</div><h2>🧺 分类归置</h2><p class="lead">同一堆东西，可以有不同的整理办法。请先选择一种分类方法。</p></div></div><div class="scene"><div class="classify-setup"><div class="method-grid">${Object.entries(methods).map(([id,m])=>`<button class="method" data-method="${id}"><span style="font-size:45px">${m.icon}</span><br>${m.label}<br><small>${m.groups.length} 个筐</small></button>`).join('')}</div></div></div></div>`;
    const method=isHigh?methods[transient.sortMethod]:{label:'按用途分类',groups:['食物','工具','衣物'],field:'use'};const placed=Object.keys(transient.placements).length;return `<div class="task-shell card"><div class="task-heading"><div><div class="eyebrow">任务 · 解决“找不到”</div><h2>🧺 分类归置</h2><p class="lead">先点一件物品，再点它应该去的筐。</p></div><span class="pill">${method.label} · ${placed}/${items.length}</span></div><div class="scene"><div class="sort-area"><div class="items-tray">${items.map(x=>`<button class="item-chip ${transient.selectedItem===x.id?'selected':''} ${transient.placements[x.id]?'placed':''}" data-item="${x.id}"><span class="emoji">${x.emoji}</span>${x.name}</button>`).join('')}</div><div class="baskets">${method.groups.map(group=>`<button class="basket" data-basket="${group}"><h3>${group}筐</h3><div class="basket-items">${items.filter(x=>transient.placements[x.id]===group).map(x=>`<span title="${x.name}">${x.emoji}</span>`).join('')}</div></button>`).join('')}</div></div></div>${placed===items.length?`<div class="actions"><button class="btn green" data-action="finish-classify">✓ 分类完成，生成我的办法图</button></div>`:''}</div>`}

  function auditTask(){const high=state.route==='high',rows=high?auditData.high:auditData.low,wrongRows=rows.filter(x=>x.actual!==x.book),allFound=transient.auditFound.length===wrongRows.length;return `<div class="task-shell card"><div class="task-heading"><div><div class="eyebrow">任务 · 解决“对不上”</div><h2>🔎 盘点核对</h2><p class="lead">数一数货架上的物品，再点记录册里“数量不对”的那一类。</p></div><span class="pill">找到 ${transient.auditFound.length}/${wrongRows.length} 处</span></div><div class="scene"><div class="audit-layout"><div class="shelf"><h3>🪵 实际货架</h3>${rows.map(x=>`<div class="audit-row"><b>${x.name}</b><span class="things">${x.emoji.repeat(x.actual)}</span><strong>？件</strong></div>`).join('')}</div><div class="ledger"><h3>📜 仓库记录册</h3>${rows.map((x,i)=>`<button class="ledger-row ${transient.auditFound.includes(i)?'correct':''}" data-audit="${i}" ${transient.auditFound.includes(i)?'disabled':''}><span>${x.emoji} ${x.name}</span><b>记着 ${x.book} 件</b></button>`).join('')}</div></div></div>${transient.auditStep!==null&&high&&!transient.auditFound.includes(transient.auditStep)?auditFollowup(rows[transient.auditStep]):''}${allFound?`<div class="actions"><button class="btn blue" data-action="finish-audit">📋 完成盘点，生成我的盘点报告</button></div>`:''}</div>`}
  function auditFollowup(row){const diff=Math.abs(row.book-row.actual),direction=row.actual>row.book?'多':'少';return `<div class="followup"><h3>${row.name}：记录 ${row.book} 件，实际 ${row.actual} 件</h3><p><b>第一步：</b>实际比记录${direction}了几个？</p><div class="option-grid">${[1,2,3,4].map(n=>`<button class="option ${transient.auditDiff===n?'selected':''}" data-diff="${n}">${n} 个</button>`).join('')}</div><p style="margin-top:15px"><b>第二步：</b>猜一猜为什么会错？</p><div class="option-grid">${['搬运时漏记了','出库后忘记登记','绳结自己跑掉了'].map(r=>`<button class="option ${transient.auditReason===r?'selected':''}" data-reason="${r}">${r}</button>`).join('')}</div><div class="actions"><button class="btn blue" data-action="confirm-audit" ${transient.auditDiff&&transient.auditReason?'':'disabled'}>确认我的判断</button></div><small>正确线索：差 ${diff} 件。想想“实际”和“记录”谁更大。</small></div>`}

  function completeTask(type,result,points){state.results[type]=result;if(!state.completed.includes(type))state.completed.push(type);state.score+=points;state.lastMap=type;state.screen='map';save();confetti();render()}
  function getMap(type=state.lastMap){const r=state.results[type]||{};if(type==='record')return {title:'我的收货记录',solved:'记不住',icon:'🪢',branches:[{icon:'📦',title:`一共收了 ${r.total||0} 件`,detail:`我逐件签收，没有漏掉。`},{icon:'🏺',title:'有这些东西',detail:(r.items||[]).join('、')},{icon:'🪢',title:`我打了 ${r.knots||0} 个绳结`,detail:r.fragile!==undefined?`红色结记易碎品 ${r.fragile} 件，蓝色结记普通品 ${r.normal} 件。`:'每签收一件，就在绳上打一个结。'},{icon:'💡',title:'我的发现',detail:'记录要及时，还要一件一件核对。'}]};
    if(type==='classify'){const groups=Object.entries(r.groups||{});return {title:'我的分类好办法',solved:'找不到',icon:'🧺',branches:[{icon:'🎯',title:`我用：${r.method||'分类法'}`,detail:`我先想好标准，再把物品送进对应的筐。`},...groups.slice(0,3).map(([k,v],i)=>({icon:['1️⃣','2️⃣','3️⃣'][i],title:`${k}：${v.length} 件`,detail:v.join('、')}))].slice(0,4)};}
    return {title:'我的盘点报告',solved:'对不上',icon:'🔍',branches:[{icon:'📜',title:`记录共 ${r.bookTotal||0} 件`,detail:'这是记录册里写下的数量。'},{icon:'👀',title:`实际共 ${r.actualTotal||0} 件`,detail:'这是我一件一件数出来的数量。'},{icon:'⚖️',title:`发现 ${r.errors?.length||0} 处差错`,detail:(r.errors||[]).map(x=>`${x.name}差${x.diff}件`).join('；')},{icon:'💡',title:'可能的原因',detail:[...new Set((r.errors||[]).map(x=>x.reason))].join('；')||'登记不及时'}]};
  }
  function mapScreen(){const map=getMap();const praise=praiseTemplates[(state.score+state.completed.length*3)%praiseTemplates.length];const need=state.route==='high'?2:1,more=state.completed.length<need;return `<div class="map-page"><div class="praise card">${cangjie()}<div><div class="eyebrow">仓颉说</div><div class="praise-text" id="praiseText">${praise}</div></div><button class="btn ghost" data-action="ai-praise">✨ 让仓颉亲口夸夸你</button></div><div class="map-wrap card"><div class="map-title"><div class="eyebrow">太棒了！你帮仓颉解决了“${map.solved}”问题</div><h2>${map.title}</h2><p>点一朵彩色云，看看里面藏着什么。</p></div><div class="bubble-map" id="bubbleMap"><i class="vine v0"></i><i class="vine v1"></i><i class="vine v2"></i><i class="vine v3"></i><button class="center-bubble">${map.icon}<br>${map.title}</button>${map.branches.map((b,i)=>`<button class="branch-bubble b${i}" style="--bubble:${['#f8b463','#89d3ef','#9fd77a','#e8a2c4'][i]}" data-branch="${i}"><span>${b.icon}</span><br>${b.title}</button>`).join('')}</div><div class="detail-drawer" id="detailDrawer">👆 点击任意一朵云，说说你是怎么做的</div><div class="actions"><button class="btn ghost" data-action="save-map">📸 保存我的办法图</button><button class="btn ghost" data-action="ai-polish">✨ 让AI帮我美化</button>${more?`<button class="btn primary" data-action="continue">➡️ 继续解决下一个问题</button><button class="btn blue" data-action="report-locked">🎤 我要上台汇报</button>`:`<button class="btn blue" data-action="report">🎤 我要上台汇报</button>`}</div></div></div>`}

  function miniMap(){const map=getMap();return `<div class="mini-map card"><div class="eyebrow">${esc(state.name)}的办法图</div><div class="mini-center">${map.icon}<br>${map.title}</div><div class="mini-branches">${map.branches.map(x=>`<span>${x.icon} ${x.title}</span>`).join('')}</div></div>`}
  function reportScreen(){const map=getMap();return `<div><div class="guide card">${cangjie()}<div class="speech">加油，${esc(state.name)}！你一定能讲得很棒！</div></div><h1 style="text-align:center">准备好上台汇报了吗？</h1><div class="report-layout">${miniMap()}<div class="tips card"><h2>🎤 汇报小提示</h2><div class="tip"><span class="tip-no">1</span><span>先介绍：“大家好，我叫${esc(state.name)}。”</span></div><div class="tip"><span class="tip-no">2</span><span>说说：“我帮仓颉解决了${map.solved}问题。”</span></div><div class="tip"><span class="tip-no">3</span><span>指着办法图，说说你是怎么做的、发现了什么。</span></div><div class="assistant-box"><b>🤖 汇报小助手</b><p>输入你担心的问题，离线小助手也会给你建议。</p><div class="ask-row"><input id="assistantInput" maxlength="30" placeholder="例如：我紧张怎么办？"><button class="btn blue" data-action="ask-assistant">问一问</button></div><div id="assistantAnswer" class="assistant-answer"></div></div></div></div><div class="actions"><button class="btn ghost" data-action="back-map">⬅️ 再看看我的办法图</button><button class="btn green" data-action="ready">✅ 我准备好了</button></div></div>`}
  function endScreen(){return `<div class="medal-page"><div class="eyebrow">冒险完成</div><h1>${esc(state.name)}，这是你的荣誉！</h1><div class="medal"><div class="medal-inner">🏆<strong>优秀仓库<br>小管家</strong></div></div><div class="summary-cards"><div class="summary">我的总分<b>${state.score}</b></div><div class="summary">解决难题<b>${state.completed.length} 个</b></div><div class="summary">完成路线<b>${state.route==='high'?'高级':'初级'}</b></div></div><div class="guide card" style="max-width:760px;margin:auto">${cangjie()}<div class="speech">太感谢你啦！下次还有更难的挑战等你来！</div></div><div class="actions"><button class="btn primary" data-action="restart">🔄 再玩一次</button></div></div>`}

  function bind(){
    document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let n=document.getElementById('nameInput').value;if(b.dataset.key==='delete')n=n.slice(0,-1);else if(b.dataset.key==='clear')n='';else if(n.length<8)n+=b.dataset.key;state.name=n;document.getElementById('nameInput').value=n;save()});
    document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;save();render()});
    document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>startProblem(b.dataset.problem));
    document.querySelectorAll('[data-cargo-type]').forEach(b=>b.onclick=()=>handleCargo(b.dataset.cargoType));
    document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{transient.sortMethod=b.dataset.method;render()});
    document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{transient.selectedItem=b.dataset.item;render()});
    document.querySelectorAll('[data-basket]').forEach(b=>b.onclick=()=>handleBasket(b.dataset.basket));
    document.querySelectorAll('[data-audit]').forEach(b=>b.onclick=()=>handleAudit(Number(b.dataset.audit),b));
    document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{transient.auditDiff=Number(b.dataset.diff);render()});
    document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{transient.auditReason=b.dataset.reason;render()});
    document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{const x=getMap().branches[Number(b.dataset.branch)];document.getElementById('detailDrawer').innerHTML=`<b>${x.icon} ${esc(x.title)}</b><br>${esc(x.detail)}`});
    document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
  }
  function handleCargo(type){const count=state.route==='high'?8:5,item=cargos[transient.cargoIndex];if(!item||transient.cargoIndex>=count)return;if(type!==item.type){toast('再想想～ 这件东西怕不怕摔？');return}transient.cargoLog.push(item);transient.cargoIndex++;state.score+=10;save();toast('签收成功！绳结 +1，⭐ +10');render()}
  function handleBasket(group){if(!transient.selectedItem){toast('先点一件物品，再点筐～');return}const item=sortItems.find(x=>x.id===transient.selectedItem),method=state.route==='high'?methods[transient.sortMethod]:{field:'use'};let expected=item[method.field];if(state.route==='high'&&transient.sortMethod==='use')expected=item.use==='食物'?'食物':item.use==='工具'?'生产工具':'生活用品';if(state.route==='high'&&transient.sortMethod==='material')expected=['石头','泥土'].includes(item.material)?'石土':item.material;if(expected!==group){toast('再想想～ 它和这个筐里的东西有什么共同点？');return}transient.placements[item.id]=group;transient.selectedItem=null;state.score+=10;save();toast('放对啦！⭐ +10');render()}
  function handleAudit(i,button){const rows=state.route==='high'?auditData.high:auditData.low,row=rows[i];if(row.actual===row.book){button.classList.add('wrong');setTimeout(()=>button.classList.remove('wrong'),400);toast('这类数量是对的，再仔细数一数哦～');return}if(state.route==='low'){transient.auditFound=[i];state.score+=30;save();toast('太厉害啦！问题被你找到了！⭐ +30');render()}else{transient.auditStep=i;transient.auditDiff=null;transient.auditReason='';render()}}
  function action(id){
    if(id==='start'){const name=document.getElementById('nameInput').value.trim();if(!name)return toast('先用小键盘输入名字吧！');if(!state.route)return toast('请选择初级或高级路线！');const chosenRoute=state.route;transient=newTransient();state={...defaultState(),name,route:chosenRoute,screen:'problems',started:true,taskState:transient};save();render();return}
    if(id==='resume'){state.screen=state.screen==='welcome'?'problems':state.screen;save();render();return}
    if(id==='finish-record'){const log=transient.cargoLog;completeTask('record',{total:log.length,items:log.map(x=>x.name),knots:log.length,fragile:state.route==='high'?log.filter(x=>x.type==='fragile').length:undefined,normal:state.route==='high'?log.filter(x=>x.type==='normal').length:undefined},20);return}
    if(id==='finish-classify'){const method=state.route==='high'?methods[transient.sortMethod]:{label:'按用途分类'};const groups={};Object.entries(transient.placements).forEach(([itemId,g])=>{(groups[g]??=[]).push(sortItems.find(x=>x.id===itemId).name)});completeTask('classify',{method:method.label,groups},25);return}
    if(id==='confirm-audit'){const rows=auditData.high,row=rows[transient.auditStep],diff=Math.abs(row.book-row.actual);if(transient.auditDiff!==diff){toast('差的数量还不对，再用大数减小数试试～');return}if(transient.auditReason==='绳结自己跑掉了'){toast('绳结不会自己跑，想想是不是登记步骤出了问题～');return}transient.auditFound.push(transient.auditStep);transient.auditStep=null;state.score+=35;save();toast('判断有依据！找到一处差错，⭐ +35');render();return}
    if(id==='finish-audit'){const rows=state.route==='high'?auditData.high:auditData.low,errors=rows.filter(x=>x.actual!==x.book).map((x,i)=>({name:x.name,diff:Math.abs(x.actual-x.book),reason:state.route==='high'?(i===0?'搬运时漏记了':'出库后忘记登记'):'清点后没有及时改记录'}));completeTask('audit',{bookTotal:rows.reduce((s,x)=>s+x.book,0),actualTotal:rows.reduce((s,x)=>s+x.actual,0),errors},30);return}
    if(id==='continue'){state.screen='problems';save();render();return}
    if(id==='report-locked'){toast('高级大管家要带着两张办法图上台，再解决一个问题吧！');return}
    if(id==='report'){state.screen='report';save();render();return}
    if(id==='back-map'){state.screen='map';save();render();return}
    if(id==='ready'){state.score+=50;state.screen='end';save();confetti();render();return}
    if(id==='restart'){const oldName=state.name;transient=newTransient();state=defaultState();state.name=oldName;state.taskState=transient;save();render();return}
    if(id==='save-map'){downloadMap();return}
    if(id==='ai-praise'){offlinePraise();return}
    if(id==='ai-polish'){offlinePolish();return}
    if(id==='ask-assistant'){askAssistant();return}
  }

  function downloadMap(){const map=getMap(),colors=['#f8b463','#89d3ef','#9fd77a','#e8a2c4'];const branches=map.branches.map((b,i)=>{const pos=[[55,65],[665,65],[55,350],[665,350]][i];return `<g><rect x="${pos[0]}" y="${pos[1]}" rx="45" width="280" height="130" fill="${colors[i]}" stroke="#fff" stroke-width="8"/><text x="${pos[0]+140}" y="${pos[1]+54}" text-anchor="middle" font-size="28" font-weight="bold">${b.icon} ${xml(b.title)}</text><text x="${pos[0]+140}" y="${pos[1]+92}" text-anchor="middle" font-size="18">${xml((b.detail||'').slice(0,18))}</text></g>`}).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600"><rect width="1000" height="600" rx="32" fill="#fff7df"/><text x="500" y="35" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" fill="#7d4b29">${xml(state.name)}的办法图</text><path d="M330 130 L420 245 M670 130 L580 245 M330 415 L420 335 M670 415 L580 335" stroke="#78a858" stroke-width="14" stroke-linecap="round"/>${branches}<ellipse cx="500" cy="290" rx="155" ry="105" fill="#ffd668" stroke="#fff" stroke-width="10"/><text x="500" y="280" text-anchor="middle" font-family="Microsoft YaHei" font-size="40">${map.icon}</text><text x="500" y="325" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="bold">${xml(map.title)}</text></svg>`;const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.name}-${map.title}.svg`;a.click();URL.revokeObjectURL(a.href);toast('办法图已保存！也可以用平板截图收藏 📸')}
  function xml(s){return esc(s).replace(/'/g,'&apos;')}

  /* AI 接入点 1：仓颉个性化评价。
     未来可在这里把 {name, route, score, completed, results} POST 给安全的服务端代理。
     不要把 API Key 写进本 HTML。默认采用本地 10 组评价模板。 */
  function offlinePraise(){const idx=Math.floor(Math.random()*praiseTemplates.length);document.getElementById('praiseText').textContent=`${state.name}，${praiseTemplates[idx]}`;toast('仓颉根据你的表现换了一句表扬！')}

  /* AI 接入点 2：办法图内容润色。
     未来由服务端返回与 branches 同结构的 JSON；默认仅切换更生动的本地表达。 */
  function offlinePolish(){const d=document.getElementById('detailDrawer');d.innerHTML='✨ 已启用离线美化：上台时可以加一句——“我不是随便猜的，我是一步一步检查出来的！”';toast('离线美化完成，不联网也能用！')}

  /* AI 接入点 3：汇报小助手。
     未来可把孩子的问题交给受控服务端；默认用关键词匹配，不收集、不上传任何内容。 */
  function askAssistant(){const input=document.getElementById('assistantInput'),answer=document.getElementById('assistantAnswer'),q=input.value.trim();if(!q)return toast('先写下你担心的事吧～');let text='先看着你的办法图，从一朵云讲起。一次只讲一件事，就不会乱啦！';if(/紧张|害怕|不敢/.test(q))text='紧张说明你很认真。上台前慢慢吸气、呼气各三次，先看着第一位微笑的同学说第一句。';else if(/忘|想不起来|忘词/.test(q))text='忘词时不用慌，指一指办法图上的下一朵云，说“接下来我做了……”就能继续。';else if(/声音|听不见|小声/.test(q))text='脚站稳，抬起头，把声音送到教室最后一排。每说完一句，停半秒。';answer.textContent=text;answer.style.display='block'}

  window.__CANGJIE__={getState:()=>JSON.parse(JSON.stringify(state)),reset:()=>{state=defaultState();save();render()},startProblem,getMap,version:'1.0.0'};
  render();
})();
</script>
</body>
